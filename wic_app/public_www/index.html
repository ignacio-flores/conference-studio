<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Inequality Conference 2026: Parallel Sessions Programme</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main id="app">
    <header class="site-header">
      <div class="brand-row">
        <div class="conference-logo-card">
          <img src="assets/logos/WIC-logo.png" alt="World Inequality Conference, Paris School of Economics, 04-06 June 2026">
        </div>
        <div class="header-copy">
          <p class="eyebrow">Public Programme</p>
          <h1 id="site-title">Parallel Sessions Programme</h1>
          <p id="site-subtitle" class="site-subtitle"></p>
        </div>
      </div>
      <nav class="site-nav" aria-label="Primary">
        <button type="button" class="nav-link is-active" data-view="programme">Programme</button>
        <a class="nav-link" href="https://inequalitylab.world/www-site/uploads/2026/04/2026-WIC-Programme.pdf" target="_blank" rel="noreferrer noopener">Plenary Sessions</a>
        <button type="button" class="nav-link" data-view="papers">Papers</button>
      </nav>
    </header>

    <section id="programme-toolbar" class="toolbar">
      <div class="programme-tools">
        <div id="day-switcher" class="day-switcher" aria-label="Conference days"></div>
        <a id="download-link" class="download-link" href="programme.xlsx" download>Download Excel</a>
        <a id="download-pdf-link" class="download-link" href="programme.pdf" download>Download PDF</a>
      </div>
      <p id="generated-at" class="generated-at"></p>
    </section>

    <section id="programme-view" class="view is-active" aria-label="Programme"></section>

    <section id="papers-view" class="view" aria-label="Papers" hidden>
      <div class="papers-controls">
        <label class="search-label" for="paper-search">Search papers</label>
        <input id="paper-search" class="paper-search" type="search" placeholder="Title, author, session">
      </div>
      <div id="papers-results" class="papers-results"></div>
    </section>

    <footer class="site-footer" aria-label="Conference partners">
      <p class="partner-label">Funding partners and institutional support</p>
      <div class="partner-logo-card">
        <img src="assets/logos/Logos-partners-768x414.png" alt="Funding partners and institutional support logos">
      </div>
    </footer>
  </main>

  <template id="session-detail-template">
    <article class="session-card">
      <button type="button" class="session-summary">
        <p class="session-room"></p>
        <h3 class="session-title"></h3>
        <p class="session-meta"></p>
      </button>
      <div class="session-detail" hidden></div>
    </article>
  </template>

  <template id="talk-row-template">
    <article class="talk-row">
      <div class="talk-heading">
        <a class="talk-title talk-title-link" href="#" target="_blank" rel="noreferrer noopener" hidden>Paper title</a>
        <span class="talk-title talk-title-text">Paper title</span>
        <span class="talk-authors"></span>
      </div>
      <button type="button" class="abstract-toggle">Show abstract</button>
      <div class="abstract-panel" hidden></div>
    </article>
  </template>

  <script src="assets/app.js" defer></script>
</body>
</html>
